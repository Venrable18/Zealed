[workspace]
resolver = "2"
exclude = [".deps"]

members = [
    "crates/webzjs-common",
    "crates/webzjs-keys",
    "crates/webzjs-wallet",
]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = 3
lto = true
codegen-units = 1

[workspace.dependencies]
## Web dependencies
wasm-bindgen = "=0.2.100" # PINNED: 0.2.108+ has TextEncoder.encodeInto issues with MetaMask Snap sandbox
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = [
    "console",
] }
wasm-bindgen-rayon = { version = "1.3" } # Update to higher version cause playwright test in chtomium fail

# WASM specific dependencies
tracing-web = { version = "0.1.3" }
console_error_panic_hook = { version = "0.1.7" }
tonic-web-wasm-client = "0.8.0"
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

## Zcash dependencies: the released NU6.3 library stack (zcash_client_backend 0.24.0), plus two
## small patches applied by scripts/setup.sh (see the patch section at the end). zcash_client_memory
## is the version from zcash/zcash_client_memory#17, which adds Ironwood (NU6.3) support: without it
## the wallet cannot store any note received since NU6.3.
zcash_keys = { version = "0.16.1", features = ["transparent-inputs", "orchard", "sapling", "unstable"] }
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard"] }
zcash_client_memory = { path = ".deps/zcash_client_memory", features = ["orchard", "transparent-inputs"] }
zcash_primitives = { version = "0.30.1" }
zcash_transparent = { version = "0.10.0", default-features = false }
zcash_address = { version = "0.13.0" }
zcash_proofs = { version = "0.30.0", default-features = false, features = ["bundled-prover", "multicore"] }
zip321 = { version = "0.9.0" }
zip32 = { version = "0.2" }
zcash_protocol = { version = "0.10.6", default-features = false }
pczt = { version = "0.9.3", default-features = false, features = ["orchard", "sapling", "transparent"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
bip32 = { version = "=0.6.0-pre.1", default-features = false, features = ["alloc"] }
## gRPC Web dependencies
prost = { version = "0.14", default-features = false }
tonic = { version = "0.14", default-features = false }



getrandom = { version = "0.2", features = ["js"] }
thiserror = "1.0.63"
indexed_db_futures = "0.5.0"
sha2 = "0.10"
ripemd = "0.1"
bip0039 = "0.12.0"
secrecy = "0.8.0"
futures-util = "0.3.30"
nonempty = "0.11"
hex = "0.4.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
rayon = { version = "1.8", features = ["web_spin_lock"] }
subtle = "2.6.1"

wasm_sync = "0.1.2"
http = { version = "1.1.0", default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
postcard = { version = "1.0.10", features = ["alloc"] }
serde-wasm-bindgen = "0.6.5"

wasm-bindgen-test = "=0.3.50"
tempfile = "3.12"
# Used in Native tests
tokio = { version = "1.0", features = ["rt", "macros"] }
byte-unit = { version = "5.1.4", features = ["byte"] }

[patch.crates-io]
# Our patched copies, fetched by scripts/setup.sh from crates.io (checksums checked):
#   zcash_protocol: NU7's branch id (0x77190AD9) and testnet activation height (4,465,026).
#   zcash_client_backend: a failed transparent-UTXO refresh does not stop a sync.
zcash_protocol = { path = ".deps/zcash_protocol" }
zcash_client_backend = { path = ".deps/zcash_client_backend" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen)', 'cfg(wasm_bindgen_unstable_test_coverage)'] }