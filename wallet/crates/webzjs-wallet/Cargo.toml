[package]
name = "webzjs-wallet"
version = "0.1.0"
authors = ["ChainSafe Systems"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZcashCommunityGrants/WebZjs"
description = "A browser client-side library for implementing Zcash wallets"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-O4"]

[features]
default = ["native", "multicore"]

multicore = ["zcash_proofs/multicore", "zcash_primitives/multicore", "zcash_client_memory/multicore"]

# WASM specific features
wasm = ["console_error_panic_hook", "dep:tracing-web"]
wasm-parallel = ["wasm", "wasm-bindgen-rayon", "multicore"]
native = ["tonic/channel", "tonic/gzip", "tonic/tls-webpki-roots", "tokio/macros", "tokio/rt", "tokio/rt-multi-thread"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
no-bundler = ["wasm-bindgen-rayon?/no-bundler", "wasm_thread/no-bundler"]

[dependencies]
webzjs-common = { path = "../webzjs-common" }
webzjs-keys = { path = "../webzjs-keys" }
## Web dependencies
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys.workspace = true

wasm-bindgen-futures = "0.4.43"
wasm-bindgen-rayon = { version = "1.3", optional = true }

# WASM specific dependencies
tracing-web = { version = "0.1.3", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
tonic-web-wasm-client = "0.8.0"
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

## Time with WASM support (enables JavaScript Date API for time::OffsetDateTime::now_utc())
time = { version = "0.3.22", features = ["wasm-bindgen"] }

## Zcash dependencies

zcash_keys = { workspace = true, features = ["transparent-inputs", "orchard", "sapling", "unstable", "unstable-frost"] }
zcash_client_backend = { workspace = true, default-features = false, features = [
    "sync",
    "lightwalletd-tonic",
    "orchard",
    "pczt",
    "transparent-inputs",
] }
zcash_client_memory = { workspace = true, features = ["orchard", "transparent-inputs"] }
zcash_primitives = { workspace = true }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true, default-features = false }
zcash_proofs = { workspace = true, default-features = false, features = ["bundled-prover", "multicore"] }
zip321 = { workspace = true }
zip32 = { workspace = true }
pczt = { workspace = true, default-features = false, features = ["orchard", "sapling", "transparent"] }
orchard = { version = "0.15.5", default-features = false }
# Threshold signing for shared pots (see src/frost.rs).
reddsa = { version = "0.5.2", default-features = false, features = ["frost", "std"] }
frost-rerandomized = { version = "3.0.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
ff = "0.13"
sapling = { workspace = true }
bip32.workspace = true
## gRPC Web dependencies
prost = { version = "0.14", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

# Used in Native tests
tokio.workspace = true

getrandom = { workspace = true, features = ["js"] }
thiserror.workspace = true
indexed_db_futures = "0.5.0"
sha2 = "0.10"
ripemd = "0.1"
bip0039 = "0.12.0"
secrecy = "0.8.0"
futures-util = "0.3.30"
nonempty = "0.11"
hex = "0.4.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
rayon = { version = "1.8", features = ["web_spin_lock"] }
subtle = "2.6.1"
# Our copy, patched not to use eval (see patches/wasm_thread-no-eval.patch and scripts/setup.sh).
wasm_thread = { path = "../../.deps/wasm_thread", default-features = false, features = [
    "keep_worker_alive",
    "es_modules",
] }

wasm_sync = "0.1.2"
http = { version = "1.1.0", default-features = false }
serde.workspace = true
serde_json = "1"
postcard = { version = "1.0.10", features = ["alloc"] }
serde-wasm-bindgen.workspace = true

[lints]
workspace = true

[dev-dependencies]
zcash_note_encryption = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
